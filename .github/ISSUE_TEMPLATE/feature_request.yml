name: Feature request
description: Suggest an idea, enhancement, or new capability for an a-novel project.
title: "feat: <short description>"
type: Feature
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature.

        - Search [existing issues](https://github.com/a-novel) and the
          [roadmap](https://github.com/orgs/a-novel/projects/7) first, to avoid duplicates.
        - Discuss an idea you are not sure about yet on [Discord](https://discord.gg/rp4Qr8cA),
          and file it here once it is a concrete ask.

  - type: input
    id: target-repo
    attributes:
      label: Target repository
      description: |
        The repository or repositories the feature belongs in. A best guess is fine: a maintainer
        reassigns it when needed.
      placeholder: e.g. a-novel/service-authentication, a-novel-kit/golib, a-novel-kit/uikit
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: |
        The problem to solve: the pain point users hit, or the gap in the current API. Keep the
        implementation you have in mind for the next field.
      placeholder: |
        Today, when I try to do X, I have to do Y, which is painful because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        The change you would like to see, such as an API shape, a UX flow or a configuration
        option.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches or workarounds you tried, and what did or did not work. Name any tool or
        library that solves a similar problem another way.
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this be a breaking change?
      description: |
        A breaking change removes or renames a public symbol, changes what a public API does, or
        otherwise makes existing consumers update their code or configuration.
      options:
        - "No — fully backwards compatible"
        - "Yes — but staged migration is possible"
        - "Yes — hard break, no migration path"
        - "I'm not sure"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case / motivation
      description: |
        Who benefits, and the project, integration or workflow that needs the feature. Real-world
        context helps us prioritize.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Any other context, mockups, related discussions or prior art.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: |
        By submitting this request, you agree to follow the project's
        [Code of Conduct](https://github.com/a-novel/.github/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have checked the roadmap and confirmed this is not already planned.
          required: true
