# Sweeps the org's board and repairs any drift from the pull requests and issues underneath. Events
# update the board as they happen, and this sweep catches what they miss. GitHub starts scheduled
# workflows hours late, so a-novel/infra's Cloud Scheduler dispatches this one every 15 minutes.
name: reconcile-board

on:
  workflow_dispatch:

# One reconcile at a time per board.
concurrency:
  group: reconcile-board
  cancel-in-progress: false

jobs:
  reconcile:
    # The callee mints its own App token. The caller's block caps the callee's, so it grants nothing.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/reconcile-board.yaml@v1.77.1
    with:
      project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      # Posts epic-freeze check-runs, which fail on a partial landing.
      detect_dry_run: "false"
      # Writes each Epic's and Initiative's Status, rolled up from its children.
      rollup_dry_run: "false"
      # Archives and closes resolved Applied meta work across the org.
      archive_dry_run: "false"
    secrets:
      private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
