# Per-org board reconcile sweep — a thin caller of the shared reusable workflow in
# a-novel-kit/workflows. The sweep's logic (rollup + status-drift + merge-gate re-post) lives there;
# this file owns only the concurrency and the per-org board id. GitHub starts scheduled workflows
# hours late, so the Google Cloud clock (github-dispatch, in a-novel/infra) dispatches it every 15
# minutes: the fail-safe cadence, not the primary path.
name: reconcile-board

on:
  workflow_dispatch:

# One reconcile at a time per board.
concurrency:
  group: reconcile-board
  cancel-in-progress: false

jobs:
  reconcile:
    # The callee mints its own App token and declares permissions: {}; the
    # caller sets the ceiling, so it must not hand down the repo default.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/reconcile-board.yaml@v1.58.0
    with:
      project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      # Enforce the partial-landing detector: the sweep posts epic-freeze check-runs (success on
      # healthy + standalone heads, failure on a partial landing) instead of only logging.
      detect_dry_run: "false"
      # Board lifecycle live (validated dry 2026-07-07): roll each Epic/Initiative's Status up from
      # its children, and archive+close resolved "Applied" meta work org-wide.
      rollup_dry_run: "false"
      archive_dry_run: "false"
    secrets:
      private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
