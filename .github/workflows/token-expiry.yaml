# Warns the token-expiry Discord channel before the org's fine-grained personal access tokens
# expire. The App token is scoped to this org, so each org sweeps its own tokens. GitHub starts
# scheduled workflows hours late, so a-novel/infra's Cloud Scheduler dispatches this one daily at
# 08:00 UTC, with no inputs.
name: token-expiry

on:
  workflow_dispatch:
    inputs:
      test_run:
        description: "Test run: post to the token-expiry channel for every token, ignoring the ping policy."
        type: boolean
        default: false

# One sweep at a time.
concurrency:
  group: token-expiry
  cancel-in-progress: false

jobs:
  token-expiry:
    # The callee mints its own App token. The caller's block caps the callee's, so it grants nothing.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/token-expiry.yaml@v1.66.2
    with:
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      dry_run: "false"
      test_run: ${{ inputs.test_run || false }}
    secrets:
      private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
      webhook: ${{ secrets.TOKEN_EXPIRY_WEBHOOK }}
      # The admin who triages every ping.
      default_mention: ${{ secrets.TOKEN_EXPIRY_ADMIN }}
