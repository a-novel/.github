name: Bug report
description: Report a reproducible bug or regression in an a-novel project.
title: "bug: <short description>"
type: Bug
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        - Report a **security vulnerability** privately, as the
          [security policy](https://github.com/a-novel/.github/blob/master/SECURITY.md) describes.
        - Search [existing issues](https://github.com/a-novel) first, to avoid duplicates.
        - Ask questions and get support on [Discord](https://discord.gg/rp4Qr8cA).

  - type: input
    id: affected-repo
    attributes:
      label: Affected repository
      description: The repository of the `a-novel` or `a-novel-kit` organization where the bug lives.
      placeholder: e.g. a-novel/service-authentication, a-novel-kit/golib, a-novel-kit/uikit
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: |
        The version, release tag, container image tag or commit SHA you run. On `master`, paste
        the commit SHA that `git rev-parse HEAD` prints.
      placeholder: e.g. v1.4.2, master @ a1b2c3d, ghcr.io/a-novel/service-x:1.4.2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What the bug is, in a few sentences.
      placeholder: |
        When I do X, I expect Y, but I see Z instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Minimal, complete steps that reproduce the bug. Paste a code snippet or shell session that
        reproduces it as a fenced code block. Precise steps get a faster fix.
      placeholder: |
        1. Clone repo and check out commit X
        2. Run `a-novel …`
        3. Send request `…`
        4. Observe error `…`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with error messages, stack traces or screenshots.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Anything relevant to reproducing the bug.
      value: |
        - OS:
        - Architecture (amd64, arm64):
        - Go version (`go version`) — if applicable:
        - Node version (`node --version`) — if applicable:
        - Browser (name + version) — if applicable:
        - Container runtime (Docker / Podman + version) — if applicable:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Logs, stack traces or command output. **Redact every secret, token and piece of personal
        data** before submitting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other context, links or screenshots about the bug.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: |
        By submitting this issue, you agree to follow the project's
        [Code of Conduct](https://github.com/a-novel/.github/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (security reports must follow the security policy).
          required: true
