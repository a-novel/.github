name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

# This workflow only lints, so a newer commit on the same ref supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.87.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Scans offline, so no hosted service sits on the merge path.
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.87.0

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.87.0
