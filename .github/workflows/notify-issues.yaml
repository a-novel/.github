# Posts each board issue's Status and assignee changes to its repository's Discord issues channel,
# or to the org's channel when the repository has none. The reusable workflow polls the board,
# because a Status change raises no event, and dispatches each repository's notify-post.yaml with
# its posts, since only that repository reads its own webhook. GitHub starts scheduled workflows
# hours late, so a-novel/infra's Cloud Scheduler dispatches this one every 15 minutes.
name: notify-issues

on:
  workflow_dispatch:

# One poll at a time, so two runs never post the same change.
concurrency:
  group: notify-issues
  cancel-in-progress: false

jobs:
  notify:
    # The callee reads this workflow's previous run; the board goes through its App token.
    permissions:
      actions: read
    uses: a-novel-kit/workflows/.github/workflows/notify-issues-run.yaml@v1.85.0
    with:
      project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
