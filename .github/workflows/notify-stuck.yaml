# Posts bots' pull requests that stay green but never merge to the org's Discord dependencies
# channel, and to their repository's reviews channel when they wait on a review. It also tells the
# security channel when notify-audit has not succeeded for 2 hours. GitHub starts scheduled
# workflows hours late, so a-novel/infra's Cloud Scheduler dispatches this one every hour.
name: notify-stuck

on:
  workflow_dispatch:

# One poll at a time, so two runs never post the same pull request.
concurrency:
  group: notify-stuck
  cancel-in-progress: false

jobs:
  notify:
    # The callee reads this workflow's and notify-audit's runs; the pull requests go through its App token.
    permissions:
      actions: read
    uses: a-novel-kit/workflows/.github/workflows/notify-stuck-run.yaml@v1.81.3
    with:
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      roles: ${{ vars.DISCORD_REPO_ROLES }}
      bws_server_url: ${{ vars.BWS_SERVER_URL }}
    secrets:
      private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
      dependencies_webhook: ${{ secrets.DEPENDENCIES_WEBHOOK }}
      reviews_webhook: ${{ secrets.REVIEWS_WEBHOOK }}
      reviews_webhooks: ${{ secrets.REVIEWS_WEBHOOKS }}
      bws_access_token: ${{ secrets.BWS_READ_TOKEN }}
      security_webhook: ${{ secrets.SECURITY_WEBHOOK }}
      # The admin who triages every security ping, as for notify-audit.
      security_mention: ${{ secrets.TOKEN_EXPIRY_ADMIN }}
